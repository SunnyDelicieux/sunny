<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galerie — Sunny</title>
    <link rel="stylesheet" href="https://unpkg.com/xp.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="ds.css">
    <link rel="stylesheet" href="galerie.css">
    <link rel="icon" href="https://pixels.crd.co/assets/images/gallery24/42bb7bc9.gif?v=29416114">
</head>
<body style="margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center;">

<div id="header-placeholder" style="width: 870px; margin-top: 125px;"></div>
<script>
    fetch('/header-template.html')
        .then(function(r){ return r.text(); })
        .then(function(data){
            var h = document.getElementById('header-placeholder');
            h.innerHTML = data;
            h.querySelectorAll('.dropdown').forEach(function(dd){
                var menu = dd.querySelector('.dropdown-menu');
                if (!menu) return;
                dd.addEventListener('mouseenter', function(){ menu.style.display = 'block'; });
                dd.addEventListener('mouseleave', function(){ menu.style.display = 'none'; });
            });
        });
</script>

<main id="bureau" class="bureau" aria-label="Galerie">
    <noscript><p class="bureau-noscript">La galerie a besoin de JavaScript pour s'afficher.</p></noscript>
</main>

<script src="galerie-data.js"></script>
<script src="galerie.js"></script>

</body>
</html>
