<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>Walkman Goules Marseille 2007 - Synchro Firebase sur Wix</title>
<style>
  body {
    margin: 0;
    background: transparent;
    color: #eee;
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
    user-select: none;
  }

  #app {
    display: flex;
    gap: 20px;
    align-items: flex-start;
    position: relative;
    width: 880px;
  }

  #cd-holder {
    position: relative;
    width: 250px;
    height: 400px;
    user-select: none;
  }

  .cd-img {
	position: absolute;
    width: 120px;
    height: 120px;
    border-radius: 45%;
    border: none;
    cursor: grab;
    user-select: none;
    position: absolute;
    transition: opacity 0.3s ease, transform 0.3s ease;
    box-shadow: 0 0 8px #0006;
    z-index: 1;
  }

  .cd-img.locked {
    opacity: 0.3;
    filter: grayscale(100%);
    cursor: not-allowed;
    pointer-events: none;
  }

  .cd-img.hidden {
    display: none !important;
  }

  .cd-img:hover {
    transform: scale(1.05) rotate(3deg);
    box-shadow: 0 0 12px #fff5;
  }

  #walkman-container {
    position: relative;
    width: 400px;
    height: 400px;
    z-index: 20;
    animation: floaty 3s ease-in-out infinite;
  }

  @keyframes floaty {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  #walkman {
    width: 400px;
    height: 400px;
    background-image: url('https://static.wixstatic.com/media/7cbe3b_f2f97611071b4dd4bb263abc6b23df3d~mv2.png');
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    border-radius: -10;
    box-shadow: none;
    cursor: pointer;
    position: relative;
    z-index: 50;
  }

  #glow-overlay {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 220px;
    height: 220px;
    border-radius: 50%;
    pointer-events: none;
    transform: translate(-50%, -50%);
    opacity: 0;
    box-shadow:
      0 0 8px 4px rgba(173, 216, 230, 0.8),
      0 0 16px 8px rgba(173, 216, 230, 0.5);
    animation: pulseGlowBlue 2s ease forwards;
    z-index: 25;
  }

  @keyframes pulseGlowBlue {
    0% {
      opacity: 1;
      transform: translate(-50%, -50%) scale(0.9);
      box-shadow:
        0 0 8px 4px rgba(173, 216, 230, 0.8),
        0 0 16px 8px rgba(173, 216, 230, 0.5);
    }
    50% {
      opacity: 0.5;
      transform: translate(-50%, -50%) scale(1.05);
      box-shadow:
        0 0 12px 6px rgba(173, 216, 230, 0.6),
        0 0 24px 12px rgba(173, 216, 230, 0.4);
    }
    100% {
      opacity: 0;
      transform: translate(-50%, -50%) scale(1.2);
      box-shadow:
        0 0 16px 8px rgba(173, 216, 230, 0),
        0 0 32px 16px rgba(173, 216, 230, 0);
    }
  }

  @keyframes shake {
    0% { transform: translate(0, 0); }
    20% { transform: translate(-5px, 0); }
    40% { transform: translate(5px, 0); }
    60% { transform: translate(-5px, 0); }
    80% { transform: translate(5px, 0); }
    100% { transform: translate(0, 0); }
  }

  .shake {
    animation: shake 0.6s ease;
  }

  #current-track {
    margin-top: 1px;
    font-weight: 700;
    min-height: 1.2em;
    text-align: center;
    user-select: none;
    animation: pulseText 2.5s ease-in-out infinite;
  }

  @keyframes pulseText {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }

  #controls {
    margin-top: 20px;
    display: flex;
    gap: 15px;
    justify-content: center;
    flex-wrap: wrap;
  }

  button {
    padding: 8px 14px;
    background: #666;
    border: none;
    border-radius: 8px;
    color: #eee;
    font-weight: 600;
    cursor: pointer;
    user-select: none;
    transition: background-color 0.3s, transform 0.2s;
  }

  button:hover {
    background: #999;
    transform: scale(1.05);
  }

  button:active {
    transform: scale(0.95);
  }

  #cd-big {
    position: absolute;
    top: 20%;
    left: calc(0px - 200px * 0.45);
    width: 200px;
    height: 200px;
    transform: translate(0, -50%);
    transition: transform 0.5s ease;
    user-select: none;
    z-index: 10;
  }

  #cd-big.playing {
    animation: spin 3s linear infinite;
  }

  @keyframes spin {
    from { transform: translate(0, -50%) rotate(0deg); }
    to { transform: translate(0, -50%) rotate(360deg); }
  }


  #volume-control {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 10px;
    color: #ccc;
  }
  #volume-control input[type="range"] {
    width: 150px;
  }
</style>

    let currentPlaylist = [];
    let currentIndex = 0;
    let currentCdName = null;

const volumeSlider = document.getElementById("volume");
volumeSlider.addEventListener("input", () => {

    const walkman = document.getElementById("walkman");
    const currentTrackDisplay = document.getElementById("current-track");
    const cdBig = document.getElementById("cd-big");
    const glowOverlay = document.getElementById("glow-overlay");
    
function positionCDsInPile() {
  const cdsElements = document.querySelectorAll('#cd-holder .cd-img:not(.hidden)');
  const centerX = 100;  // point d'origine X
  const centerY = 170;  // point d'origine Y
  const maxXSpread = 320; // écart horizontal maximal
  const maxYSpread = 340; // écart vertical maximal
  const maxRotate = 30;   // rotation maximale

  cdsElements.forEach((el, i) => {
    const offsetX = (Math.random() - 0.5) * maxXSpread;
    const offsetY = (Math.random() - 0.5) * maxYSpread;
    const rotate = (Math.random() - 0.5) * 2 * maxRotate;

    el.style.left = `${centerX + offsetX}px`;
    el.style.top = `${centerY + offsetY}px`;
    el.style.transform = `rotate(${rotate.toFixed(1)}deg)`;
    el.style.zIndex = i + 1;
  });
}

function positionCDsInPile() {
  const cdsElements = document.querySelectorAll('#cd-holder .cd-img:not(.hidden)');
  const centerX = 100;  // position de départ à ajuster selon ton layout
  const centerY = 170;
  const maxXSpread = 320;
  const maxYSpread = 340;
  const maxRotate = 30;

  cdsElements.forEach((el, i) => {
    const offsetX = (Math.random() - 0.5) * maxXSpread;
    const offsetY = (Math.random() - 0.5) * maxYSpread;
    const rotate = (Math.random() - 0.5) * 2 * maxRotate;

    el.style.left = `${centerX + offsetX}px`;
    el.style.top = `${centerY + offsetY}px`;
    el.style.transform = `rotate(${rotate.toFixed(1)}deg)`;
    el.style.zIndex = i + 1;
  });
}


    function updateTrackDisplay(cdName, trackTitle) {
      currentTrackDisplay.textContent = `🎵 [${cdName.toUpperCase()}] ${trackTitle}`;
    }

    function updateCDSpinState() {
      if (audio.paused) {
        cdBig.classList.remove('playing');
      } else {
        cdBig.classList.add('playing');
      }
    }

    function hideCDInPile(cdName) {
      const cdImg = document.querySelector(`.cd-img[data-cd="${cdName}"]`);
      if (cdImg) cdImg.classList.add('hidden');
    }

    function showCDInPile(cdName) {
      const cdImg = document.querySelector(`.cd-img[data-cd="${cdName}"]`);
      if (cdImg) cdImg.classList.remove('hidden');
    }

    function setBigCD(cdName) {
      if (!cdName) {
        cdBig.style.display = 'none';
        cdBig.src = '';
        return;
      }
      const cdImg = document.querySelector(`.cd-img[data-cd="${cdName}"]`);
      if (!cdImg) {
        cdBig.style.display = 'none';
        cdBig.src = '';
        return;
      }
      cdBig.src = cdImg.src;
      cdBig.alt = cdImg.alt;
      cdBig.title = cdImg.title;
      cdBig.style.display = 'block';
      updateCDSpinState();
    }

    function playTrack(index) {
      if (!currentPlaylist.length) return;
      currentIndex = index;
      audio.src = currentPlaylist[currentIndex].url;
      audio.play();
      updateTrackDisplay(currentCdName, currentPlaylist[currentIndex].title);
      updateCDSpinState();
    }

    function updateStateInFirestore() {
      if (!currentCdName) return;
      ignoreFirestoreUpdates = true;
      db.collection("sharedPlayer").doc("state").set({
        currentCd: currentCdName,
        currentIndex: currentIndex,
        isPlaying: !audio.paused,
        timestamp: Date.now()
      }).then(() => {
        setTimeout(() => { ignoreFirestoreUpdates = false; }, 500);
      });
    }

    const playerDoc = db.collection("sharedPlayer").doc("state");
    playerDoc.onSnapshot(doc => {
      if (ignoreFirestoreUpdates) return;
      if (!doc.exists) return;

      const data = doc.data();
      if (!data.currentCd) return;

      if (currentCdName !== data.currentCd) {
        if (currentCdName) showCDInPile(currentCdName);
        currentCdName = data.currentCd;
        hideCDInPile(currentCdName);
        currentPlaylist = cds[currentCdName];
      }

      currentIndex = data.currentIndex;
      audio.src = currentPlaylist[currentIndex].url;

      if (data.isPlaying) audio.play();
      else audio.pause();

      updateTrackDisplay(currentCdName, currentPlaylist[currentIndex].title);
      setBigCD(currentCdName);
      updateCDSpinState();
    });

    document.getElementById("next").onclick = () => {
      if (!currentPlaylist.length) return;
      currentIndex = (currentIndex + 1) % currentPlaylist.length;
      playTrack(currentIndex);
      updateStateInFirestore();
    };

    document.getElementById("prev").onclick = () => {
      if (!currentPlaylist.length) return;
      currentIndex = (currentIndex - 1 + currentPlaylist.length) % currentPlaylist.length;
      playTrack(currentIndex);
      updateStateInFirestore();
    };

    document.getElementById("pause").onclick = () => {
      if (audio.paused) audio.play();
      else audio.pause();
      updateStateInFirestore();
      updateCDSpinState();
    };

    walkman.ondragover = e => e.preventDefault();

    walkman.ondrop = e => {
      e.preventDefault();
      dragSuccessful = true;
      const cdName = e.dataTransfer.getData("text/plain");
      if (!cdName || !cds[cdName]) {
        alert("CD inconnu ou non disponible.");
        return;
      }
      if (currentCdName) showCDInPile(currentCdName);
      currentCdName = cdName;
      hideCDInPile(currentCdName);
      currentPlaylist = cds[currentCdName];
      currentIndex = 0;

      // Animation glow et shake
      glowOverlay.style.display = "block";
      glowOverlay.style.animation = "pulseGlowBlue 2s ease forwards";
      walkman.classList.add("shake");

      // Enlever le shake et le glow après animation
      setTimeout(() => {
        walkman.classList.remove("shake");
        glowOverlay.style.display = "none";
      }, 2000);

      playTrack(currentIndex);
      updateStateInFirestore();
      setBigCD(currentCdName);
    };

    document.querySelectorAll(".cd-img").forEach(cd => {
      cd.ondragstart = e => {
        if (cd.classList.contains("locked")) {
          e.preventDefault();
          return;
        }
        dragSuccessful = false;
        e.dataTransfer.setData("text/plain", cd.dataset.cd);
      };
      cd.ondragend = e => {
        if (!dragSuccessful) {
          showCDInPile(e.target.dataset.cd);
        }
      };
    });

    window.onload = () => {
      positionCDsInPile();
    };
	window.onload = () => { 
	  positionCDsInPile();
	};
