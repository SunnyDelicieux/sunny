<script src="https://louisabraham.github.io/nekojs/neko.js" data-autostart></script>


<div id="header-placeholder" style="width: 870px; margin-top: 125px;"></div>
<script>
  fetch('/header-template.html')
    .then(response => response.text())
    .then(data => {
      const header = document.getElementById('header-placeholder');
      header.innerHTML = data;
      // Wire up dropdowns with direct style.display (no CSS classes needed)
      header.querySelectorAll('.dropdown').forEach(function(dd) {
        var menu = dd.querySelector('.dropdown-menu');
        if (!menu) return;
        dd.addEventListener('mouseenter', function() { menu.style.display = 'block'; });
        dd.addEventListener('mouseleave', function() { menu.style.display = 'none'; });
      });
    });
</script>
