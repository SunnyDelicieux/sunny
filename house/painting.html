<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painting</title>
    <link rel="stylesheet" href="house.css">
    <script src="house.js" defer></script>
    <style>
      body {
        background-color: beige;
      }
      .tableau {
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        width: 98vw;
        margin: 0 auto;
      }
      .tableau .retour {
        position: absolute;
        top: 24px;
        left: 24px;
      }
      .tableau .retour img {
        width: 90px;
      }
      .tableau > img {
        max-height: 100vh;
        object-fit: contain;
        border-radius: 12px;
        box-shadow: 0 4px 24px rgba(0,0,0,0.15);
      }
    </style>
  </head>
  <body>
    <div class="tableau">
      <a class="retour" href="couloir.html"><img src="https://i.postimg.cc/D0x6ZkZx/Design-sans-titre-(12).png" alt="Retour"></a>
      <img src="https://i.postimg.cc/WzGN5zbM/painting.png" alt="Painting">
    </div>
  </body>
</html>
