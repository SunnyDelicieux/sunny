<html>

    <link href="/style.css" rel="stylesheet" type="text/css" media="all">
    <style>
      body {
        background-image: url('https://i.pinimg.com/1200x/17/d8/70/17d8701de561dc9dcfcadf3da8d1b44a.jpg');
        background-repeat: no-repeat;
        background-size: cover;

      div {

    <img 
      src="https://i.postimg.cc/3RZD88qb/Design-sans-titre-(11).png" 
      style="cursor: pointer; width: 150px; display: block; margin: 24px auto 8px auto;"
      onclick="toggleAudio()"
      alt="cute bunny"
    >
    <script>
      function toggleAudio() {
        var audio = document.getElementById('myAudio');
        if (audio.paused) {
          audio.play().catch(function(e) {
            alert('Audio playback failed: ' + e.message);
          });
        } else {
          audio.pause();
        }
      }
    </script>
    <div style="margin-top: 7%; text-shadow: 0px 2px 2px black;">

      and maybe i was always like that<br></p>

    </div>
